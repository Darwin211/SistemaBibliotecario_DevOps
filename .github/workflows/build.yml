name: Build SistemaBibliotecario

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  build:

    runs-on: windows-latest

    steps:

    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compilar proyecto
      run: msbuild SistemaBibliotecario_/SistemaBibliotecario_.csproj /p:Configuration=Release
